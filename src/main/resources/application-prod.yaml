spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}?prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false

  mail:
    host: smtp.naver.com
    port: 465
    username: ${NAVER_EMAIL}
    password: ${NAVER_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          debug: true
          ssl:
            enable: true
            trust: smtp.naver.com
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
            port: 465

#springdoc:
#  swagger-ui:
#    enabled: false
#  api-docs:
#    enabled: false

springdoc:
  swagger-ui:
    path: /SWENG3-docs
    groups-order: asc
    operations-sorter: method
    disable-swagger-default-url: true
  api-docs:
    path: /SWENG3-api-docs

custom:
  env-name: "Production Mode"
  debug-mode: false
  site-url: "https://be-y7hs.onrender.com"
